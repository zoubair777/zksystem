{% extends "base.html" %}{% block title %}خصم دين العميل{% endblock %}{% block content %}<h4>خصم من دين العميل: {{customer.name}}</h4><div class="card"><div class="card-body"><div class="alert alert-info">الرصيد الحالي: <strong>{{"%.2f"|format(customer.balance)}}</strong></div><form method="post"><label>الفاتورة (اختياري)</label><select name="invoice_id" class="form-select mb-3"><option value="">الرصيد العام</option>{% for i in invoices %}<option value="{{i.id}}">{{i.invoice_number}}</option>{% endfor %}</select><label>مبلغ الخصم</label><input name="amount" type="number" step="0.01" min="0.01" class="form-control mb-3" required><label>سبب الخصم</label><textarea name="reason" class="form-control mb-3" required></textarea><button class="btn btn-danger">تطبيق الخصم</button></form></div></div>{% endblock %}
