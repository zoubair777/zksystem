{% extends "base.html" %}
{% block title %}التصنيفات{% endblock %}
{% block content %}
<h4 class="mb-3">التصنيفات</h4>
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">إضافة تصنيف</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <input type="text" name="name" class="form-control" placeholder="اسم التصنيف" required>
                    </div>
                    <button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> إضافة</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card">
            <table class="table mb-0">
                <thead><tr><th>#</th><th>الاسم</th><th></th></tr></thead>
                <tbody>
                {% for c in categories %}
                    <tr>
                        <td>{{ c.id }}</td><td>{{ c.name }}</td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#editCategory{{ c.id }}"><i class="bi bi-pencil"></i></button>
                            <a href="{{ url_for('delete_category', cid=c.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('حذف؟')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <div class="modal fade" id="editCategory{{ c.id }}" tabindex="-1">
                        <div class="modal-dialog"><div class="modal-content">
                            <form method="POST" action="{{ url_for('edit_category', cid=c.id) }}">
                                <div class="modal-header"><h5 class="modal-title">تعديل التصنيف</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                <div class="modal-body">
                                    <input type="text" name="name" class="form-control" value="{{ c.name }}" required>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
                                    <button class="btn btn-primary"><i class="bi bi-save"></i> حفظ</button>
                                </div>
                            </form>
                        </div></div>
                    </div>
                {% else %}
                    <tr><td colspan="3" class="text-center text-muted py-3">لا توجد تصنيفات</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
